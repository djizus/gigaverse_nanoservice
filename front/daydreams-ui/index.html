<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daydreams Agents UI</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --card-bg: #ffffff;
        --input-bg: #ffffff;
        --badge-bg: #eef2ff;
        --badge-border: #e0e7ff;
        --bubble-user-bg: #e0f2fe;
        --bubble-user-border: #bae6fd;
        --bubble-asst-bg: #f3f4f6;
        --bubble-asst-border: #e5e7eb;
        --btn-bg: #f9fafb;
        --btn-border: #d1d5db;
        --btn-text: #111827;
        --primary: #2563eb;
        --primary-border: #1d4ed8;
        --primary-text: #ffffff;
        --secondary: #10b981;
        --secondary-border: #059669;
        --secondary-text: #ffffff;
        --danger: #ef4444;
        --danger-border: #dc2626;
        --danger-text: #ffffff;
      }
      [data-theme="dark"] {
        --bg: #0b1220;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #1f2937;
        --card-bg: #0f172a;
        --input-bg: #0f172a;
        --badge-bg: #1f2937;
        --badge-border: #374151;
        --bubble-user-bg: #0b3b5e;
        --bubble-user-border: #1f4f78;
        --bubble-asst-bg: #111827;
        --bubble-asst-border: #1f2937;
        --btn-bg: #111827;
        --btn-border: #374151;
        --btn-text: #e5e7eb;
        --primary: #3b82f6;
        --primary-border: #2563eb;
        --primary-text: #ffffff;
        --secondary: #34d399;
        --secondary-border: #10b981;
        --secondary-text: #0b1220;
        --danger: #b91c1c;
        --danger-border: #991b1b;
        --danger-text: #ffffff;
      }

      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); }
      .header { display:flex; align-items:center; gap:8px; padding:12px; border-bottom:1px solid var(--border); }
      .container { display:flex; height: calc(100vh - 54px); }
      .sidebar { width: 320px; border-right:1px solid var(--border); padding:12px; overflow:auto; background: var(--bg); }
      .content { flex:1; padding:12px; overflow:auto; background: var(--bg); }
      input, select, textarea, button { font: inherit; color: var(--text); }
      input, select, textarea { padding: 8px; border:1px solid var(--border); border-radius:6px; width:100%; box-sizing:border-box; background: var(--input-bg); }
      .btn { padding: 8px 12px; border:1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-text); border-radius:6px; cursor:pointer; }
      .btn-primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary-border); }
      .btn-secondary { background: var(--secondary); color: var(--secondary-text); border-color: var(--secondary-border); }
      .btn-danger { background: var(--danger); color: var(--danger-text); border-color: var(--danger-border); }
      .list { display:flex; flex-direction:column; gap:6px; }
      .card { border:1px solid var(--border); border-radius:8px; padding:10px; background: var(--card-bg); }
      .row { display:flex; gap:8px; }
      .row > * { flex:1; }
      .toolbar { display:flex; gap:8px; align-items:center; }
      .badge { font-size: 12px; background: var(--badge-bg); border:1px solid var(--badge-border); padding:2px 6px; border-radius:999px; }
      .chat { display:flex; flex-direction:column; gap:8px; height:100%; }
      .messages { flex:1; overflow:auto; border:1px solid var(--border); border-radius:8px; padding:10px; background: var(--card-bg); }
      .msg { margin-bottom:10px; }
      .msg .meta { font-size: 12px; color: var(--muted); }
      .msg.user { text-align:right; }
      .msg.assistant { text-align:left; }
      .msg .bubble { display:inline-block; padding:8px 10px; border-radius:10px; max-width: 75%; }
      .msg.user .bubble { background: var(--bubble-user-bg); border:1px solid var(--bubble-user-border); }
      .msg.assistant .bubble { background: var(--bubble-asst-bg); border:1px solid var(--bubble-asst-border); }
      label { display:block; font-size:12px; color: var(--muted); margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
