<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daydreams Agents UI</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
      .header { display:flex; align-items:center; gap:8px; padding:12px; border-bottom:1px solid #eee; }
      .container { display:flex; height: calc(100vh - 54px); }
      .sidebar { width: 320px; border-right:1px solid #eee; padding:12px; overflow:auto; }
      .content { flex:1; padding:12px; overflow:auto; }
      input, select, textarea, button { font: inherit; }
      input, select, textarea { padding: 8px; border:1px solid #ddd; border-radius:6px; width:100%; box-sizing:border-box; }
      button { padding: 8px 12px; border:1px solid #ddd; background:#fafafa; border-radius:6px; cursor:pointer; }
      button.primary { background:#2563eb; color:white; border-color:#1d4ed8; }
      .list { display:flex; flex-direction:column; gap:6px; }
      .card { border:1px solid #eee; border-radius:8px; padding:10px; }
      .row { display:flex; gap:8px; }
      .row > * { flex:1; }
      .toolbar { display:flex; gap:8px; align-items:center; }
      .badge { font-size: 12px; background:#eef; border:1px solid #dde; padding:2px 6px; border-radius:999px; }
      .chat { display:flex; flex-direction:column; gap:8px; height:100%; }
      .messages { flex:1; overflow:auto; border:1px solid #eee; border-radius:8px; padding:10px; background:#fff; }
      .msg { margin-bottom:10px; }
      .msg .meta { font-size: 12px; color:#666; }
      .msg.user { text-align:right; }
      .msg.assistant { text-align:left; }
      .msg .bubble { display:inline-block; padding:8px 10px; border-radius:10px; max-width: 75%; }
      .msg.user .bubble { background:#e0f2fe; border:1px solid #bae6fd; }
      .msg.assistant .bubble { background:#f3f4f6; border:1px solid #e5e7eb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
