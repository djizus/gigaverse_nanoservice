name: Deploy Caddy Proxy

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name (e.g., example.com)'
        required: true
        type: string
  push:
    branches: [main, staging]
    paths:
      - 'llm-api/infra/Caddyfile'
      - 'llm-api/infra/compose.caddy.yml'
      - '.github/workflows/deploy-caddy.yml'

jobs:
  deploy-caddy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Caddy to VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          DOMAIN: ${{ github.event.inputs.domain || secrets.DOMAIN || 'aifred.cloud' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DOMAIN,GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY
          script: |
            # Navigate to project directory
            cd ${{ secrets.PROJECT_PATH || '/home/knowledge' }}
            
            # Update repository with authentication
            if [ -d ".git" ]; then
              git remote set-url origin https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            fi
            
            # Make setup script executable
            chmod +x llm-api/scripts/setup-caddy.sh
            
            # Run setup script with domain
            export DOMAIN="${DOMAIN}"
            # EUID is readonly, but we're already root in SSH context
            ./llm-api/scripts/setup-caddy.sh