version: '3.8'

services:
  llm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-api-prod
    ports:
      - '${PORT:-80}:3000'
    environment:
      # Application
      - NODE_ENV=production
      - PORT=3000
      # API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Notion
      - NOTION_API_KEY=${NOTION_API_KEY}
      # Discord
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_BOT_NAME=${DISCORD_BOT_NAME}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_API_KEY=${SUPABASE_API_KEY}
      # Memory & Knowledge
      - MEMORY_TYPE=${MEMORY_TYPE:-supabase}
      - USE_CHROMA=${USE_CHROMA:-false}
      - KNOWLEDGE_DIR=/app/knowledge
    volumes:
      # Persistent volumes for production
      - knowledge-data:/app/knowledge
      - templates-data:/app/templates
      - logs-data:/app/logs
    networks:
      - llm-network
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Nginx reverse proxy for SSL termination
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx-proxy
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #   depends_on:
  #     - llm-api
  #   networks:
  #     - llm-network
  #   restart: always

networks:
  llm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  knowledge-data:
    driver: local
  templates-data:
    driver: local
  logs-data:
    driver: local
