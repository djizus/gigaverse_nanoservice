services:
  llm-api-prod:
    image: ghcr.io/${GITHUB_REPOSITORY}:production-latest
    container_name: llm-api-prod
    ports:
      - '3000:3000'  # Expose on all interfaces for Caddy access
    env_file:
      - ../.env.prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHROMA_URL=http://chromadb-prod:8000
    volumes:
      # Production volumes
      - prod-knowledge-data:/app/knowledge
      - prod-templates-data:/app/templates
      - prod-logs-data:/app/logs
    networks:
      - prod-network
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      - "com.docker.compose.project=production"
      - "environment=production"

  # ChromaDB for production (optional)
  chromadb-prod:
    image: chromadb/chroma:latest
    container_name: chromadb-prod
    expose:
      - '8000'
    volumes:
      - prod-chromadb-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    networks:
      - prod-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "environment=production"

networks:
  prod-network:
    name: prod-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16  # Production subnet

volumes:
  prod-knowledge-data:
    driver: local
    name: prod-knowledge-data
  prod-templates-data:
    driver: local
    name: prod-templates-data
  prod-logs-data:
    driver: local
    name: prod-logs-data
  prod-chromadb-data:
    driver: local
    name: prod-chromadb-data